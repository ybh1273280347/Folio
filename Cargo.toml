[package]
name = "folio-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
comrak = "0.59.0"
dirs = "6.0.0"
chrono = "0.4"
dunce = "1.0.5"
gpui-kit = { version = "0.9.1", default-features = false, features = ["component", "syntect", "assets"] }
gpui-webview = "0.9.1"
raw-window-handle = "0.6"
wry = { version = "0.53.3", package = "lb-wry" }
gpui-kit-markdown-editor = { path = "vendor/gpui-kit-markdown-editor", default-features = false }
gpui_xterm = { path = "vendor/gpui-xterm" }
portable-pty = "0.9"
gpui-pdf = { path = "vendor/gpui-pdf", features = ["search"] }
pdf-inspector = "1.27.0"
image = { version = "0.25.10", default-features = false }
markdown = "1.0.0"
latex-rust = { path = "vendor/latex-rust", default-features = false, features = ["std"] }
merman = { version = "0.10.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape", "layout-elk", "system-fonts"] }
krilla-svg = "0.8.1"
resvg = "0.47.0"
usvg = { version = "0.47.0", features = ["system-fonts", "text"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
ttf-parser = "0.25.1"
notify = "8.2.2"
rfd = "0.15.4"
rusqlite = { version = "0.43", features = ["bundled"] }
sqlite-vec = "0.1.6"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
url = "2.5.8"
tempfile = "3.24.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
strip = true
opt-level = 2
codegen-units = 16

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
