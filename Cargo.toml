[package]
name = "folio-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
comrak = "0.59.0"
dirs = "6.0.0"
dunce = "1.0.5"
gpui-kit = { version = "0.9.1", default-features = false, features = ["component", "syntect", "assets"] }
image = { version = "0.25.10", default-features = false }
markdown = "1.0.0"
roxmltree = "0.21.2"
notify = "8.2.2"
pdfium-render = "0.9.5"
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.24.0"

[profile.release]
strip = true
opt-level = 2
codegen-units = 16
