[package]
name = "folio-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
comrak = "0.59.0"
dirs = "6.0.0"
chrono = "0.4"
dunce = "1.0.5"
gpui-kit = { version = "0.9.1", default-features = false, features = ["component", "syntect", "assets"] }
gpui-webview = "0.9.1"
raw-window-handle = "0.6"
wry = { version = "0.53.3", package = "lb-wry" }
gpui-kit-markdown-editor = { path = "vendor/gpui-kit-markdown-editor", default-features = false }
gpui_xterm = { path = "vendor/gpui-xterm" }
portable-pty = "0.9"
gpui-pdf = { path = "vendor/gpui-pdf", features = ["search"] }
image = { version = "0.25.10", default-features = false }
markdown = "1.0.0"
latex-rust = { path = "vendor/latex-rust", default-features = false, features = ["std"] }
rusty-mermaid = { git = "https://github.com/base58ed/rusty-mermaid", rev = "6907e0747822cc2ee7044250a065497ce7d8f3c0", default-features = false }
rusty-mermaid-gpui = { path = "vendor/rusty-mermaid-gpui" }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
ttf-parser = "0.25.1"
notify = "8.2.2"
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tempfile = "3.24.0"
rusty-mermaid-core = { git = "https://github.com/base58ed/rusty-mermaid", rev = "6907e0747822cc2ee7044250a065497ce7d8f3c0" }

[profile.release]
strip = true
opt-level = 2
codegen-units = 16

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
